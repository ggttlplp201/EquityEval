name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: make bootstrap
      - run: make check
      - run: make infra-config
      - run: make migration-history
      - name: Verify empty migration environment renders offline
        run: make migration-sql
        env:
          DATABASE_URL: postgresql+psycopg://equity:equity_local_dev@127.0.0.1:5433/equity
      # S6 adds OpenAPI generation and generated-TypeScript no-diff enforcement.
