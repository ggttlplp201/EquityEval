name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-and-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database-profile: [native-pg16, timescale-pg16]
    env:
      EQUITY_TEST_DB_PROFILE: ${{ matrix.database-profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install isolated database and rate-coordinator binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 redis-server
      - run: make bootstrap
      - name: Build pinned private PostgreSQL and Timescale runtime
        if: matrix.database-profile == 'timescale-pg16'
        run: .venv/bin/python scripts/setup_test_timescale.py
      - run: make check
      - run: make infra-config
      - run: make migration-history
      - name: Verify reviewed migrations render offline
        run: make migration-sql
        env:
          DATABASE_URL: postgresql+psycopg://equity:equity_local_dev@127.0.0.1:5433/equity
      - name: Stop repository-owned test runtimes
        if: always()
        run: |
          .venv/bin/python scripts/test_postgres.py stop
          .venv/bin/python scripts/test_redis.py stop
      # S6 adds OpenAPI generation and generated-TypeScript no-diff enforcement.
